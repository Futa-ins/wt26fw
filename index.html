<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WILD THINGS 26FW 商品説明一覧</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header + tab rail; grid of item cards; product page as a two-column sheet (photo | spec) that stacks on phones */
:root{
  --bg:#eef0ec; --surface:#fbfcfa; --line:#d5d9d2; --ink:#1a1e1b; --muted:#5d655f; --accent:#c4471c; --accent-ink:#ffffff; --chip:#e3e7e0; --photo:#f4f5f2;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141714;--surface:#1c201d;--line:#323833;--ink:#e8ebe6;--muted:#9aa39c;--accent:#ee7a4c;--accent-ink:#1a1e1b;--chip:#272c28;--photo:#ecedea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141714;--surface:#1c201d;--line:#323833;--ink:#e8ebe6;--muted:#9aa39c;--accent:#ee7a4c;--accent-ink:#1a1e1b;--chip:#272c28;--photo:#ecedea;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:14px 6px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1}
.brand .season{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--accent);letter-spacing:.06em}
.brand .sub{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:13px;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px 8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:disabled{cursor:default;opacity:.55}
nav.tabs .soon{font-size:10px;letter-spacing:.06em;margin-left:4px;padding:1px 5px;border-radius:3px;background:var(--chip)}
button:focus-visible,a:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{font:inherit;flex:1 1 240px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.count{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:560px){.grid,.related .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.name{font-size:16px}.brand b{font-size:22px}.brand .season{font-size:15px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .ph{position:relative;flex:none;width:100%;aspect-ratio:1;background:var(--photo);max-width:100%;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.02em}
.name{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.meta span b{color:var(--ink);font-weight:500}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line)}
.sales{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.sales span{font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--chip)}
.sales span.on::before{content:"● ";color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.cat:hover{border-color:var(--ink)}
.cat .ph{aspect-ratio:1;background:var(--photo);border-radius:6px;overflow:hidden}
.cat .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.cat h3{margin:0;font-size:17px;font-weight:700}
.cat p{margin:2px 0 0;color:var(--muted);font-size:12px}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.back{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.back:hover{border-color:var(--ink)}
h2.sec{font-size:20px;margin:0}
/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:820px){.pp{grid-template-columns:minmax(0,1fr)}}
.gallery{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.gallery{position:static}}
.main-ph{position:relative;aspect-ratio:1;background:var(--photo);border-radius:8px;overflow:hidden;max-width:100%}
.main-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{width:58px;height:58px;padding:0;border:2px solid transparent;border-radius:6px;background:var(--photo);cursor:pointer;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.cap{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.spec h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:.02em;margin:4px 0 6px;text-wrap:balance}
.spec section{border-top:1px solid var(--line);padding-block:16px}
.spec h4{margin:0 0 10px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.spec p.txt{margin:0;white-space:pre-line;max-width:65ch}
.colorlist{display:flex;flex-wrap:wrap;gap:6px}
.colorlist button{font:inherit;font-size:12px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.colorlist button img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--photo)}
.colorlist button[aria-pressed="true"]{border-color:var(--accent)}
.sizes{display:flex;gap:6px}
.sizes span{font-family:var(--f-mono);font-size:13px;min-width:38px;text-align:center;padding:4px 8px;border:1px solid var(--ink);border-radius:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:100%}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:12px}
td{font-family:var(--f-mono)}
td:first-child{font-family:var(--f-body)}
.unit{font-size:11px;color:var(--muted);margin-top:6px}
.fabtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fabtags span{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:3px 10px;border-radius:4px;background:var(--ink);color:var(--surface)}
.related{margin-top:28px;border-top:2px solid var(--ink);padding-top:16px}
.related h3{margin:0 0 4px;font-size:16px}
.related .fabname{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;color:var(--accent)}
.related .group{margin-bottom:22px}
.related .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.brandhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:18px}
@media (max-width:820px){.brandhead{grid-template-columns:minmax(0,1fr)}}
.brandhead .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.brandhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1;letter-spacing:.02em;margin:6px 0 4px}
.brandhead .quote{font-family:var(--f-display);font-size:20px;color:var(--accent);letter-spacing:.03em}
.notice{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface);max-width:65ch}
.toc{padding-block:8px;margin-bottom:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.toc .chip{white-space:nowrap}
.book{display:flex;flex-direction:column;gap:22px}
.spread{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;scroll-margin-top:130px}
.spread button{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}
.spread img{display:block;width:100%;height:auto;aspect-ratio:1800/1270}
.spread figcaption{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.spread figcaption b{color:var(--ink);font-weight:500}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,12,10,.92);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb img{display:block;width:200%;max-width:none;min-width:100%;margin:0 auto;cursor:zoom-out}
@media (min-width:1200px){.lb img{width:min(100%,2400px)}}
.lb .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);font:inherit;font-size:13px;padding:8px 14px;border-radius:6px;border:0;background:#fff;color:#111;cursor:pointer}
.booklink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:inherit;font-size:12px;padding:5px 12px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;cursor:pointer}
.fgroup{margin-bottom:34px}
.fgroup>header{position:static;background:none;border:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.fgroup>header h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em}
.fgroup>header span{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer}
.fcard:hover{border-color:var(--ink)}
.fcard .fn{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.03em}
.fcard .fj{font-size:12px;color:var(--muted);margin-top:-4px}
.fcard .fd{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.fcard .ff{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.fcard .ff b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent)}
.fcard .mini{display:flex;gap:4px}
.fcard .mini img{width:36px;height:36px;border-radius:4px;background:var(--photo);object-fit:contain;mix-blend-mode:multiply}
.fcard.none{opacity:.62}
.fcard.none .ff b{color:var(--muted)}
.fhead{max-width:760px;margin-bottom:22px}
.fhead .grp{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.fhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.05;letter-spacing:.03em;margin:4px 0 2px}
.fhead .fj{color:var(--muted);margin-bottom:12px}
.fhead p{margin:0;white-space:pre-line;max-width:65ch}
.fabtags button{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:3px 10px;border-radius:4px;background:var(--ink);color:var(--surface);border:0;cursor:pointer}
.fabtags button:hover{background:var(--accent);color:var(--accent-ink)}

.gate{max-width:560px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
.gate h2{font-family:var(--f-display);font-size:28px;letter-spacing:.03em;margin:0 0 8px}
.gate p{margin:0 0 12px}
.gate .mail{font-family:var(--f-mono);user-select:all;background:var(--chip);padding:2px 6px;border-radius:4px}
.gate form{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.gate input{font:inherit;flex:1 1 240px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.gate button{font:inherit;padding:9px 16px;border-radius:6px;border:0;background:var(--ink);color:var(--surface);cursor:pointer}
.gate .err{color:var(--accent);font-size:13px;min-height:1.4em;margin-top:8px}
.gate dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:16px 0 0}
.gate dt{font-weight:700}
.locked nav.tabs{display:none}
footer.note{color:var(--muted);font-size:11px;text-align:center;padding-block:0 32px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body class="locked">
<header>
  <div class="wrap">
    <div class="brand"><b>WILD THINGS</b><span class="season">2026 FALL / WINTER</span><span class="sub">名古屋・宮下 取扱商品 説明一覧</span></div>
    <nav class="tabs" role="tablist" aria-label="表示切替">
      <button role="tab" id="tab-items" data-tab="items">品番一覧</button>
      <button role="tab" id="tab-cats" data-tab="cats">カテゴリー別一覧</button>
      <button role="tab" id="tab-fabrics" data-tab="fabrics">生地別一覧</button>
      <button role="tab" id="tab-brand" data-tab="brand">ブランド説明</button>
      <button role="tab" disabled>売上日報<span class="soon">準備中</span></button>
      <button role="tab" disabled>在庫推移<span class="soon">準備中</span></button>
      <button role="tab" disabled>日別売上金管理<span class="soon">準備中</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="note wrap">閲覧専用｜掲載内容・画像の無断転載・再配布はご遠慮ください。© WILD THINGS / INS Inc.</footer>
<script>
function startApp(DATA,FABRICS){

const FAB=Object.fromEntries(FABRICS.map(f=>[f.id,f]));
const CAT_ORDER=["重アウター","アウター","フリース","長袖カットソー","ロングボトムス","雑貨"];
const BY=Object.fromEntries(DATA.map(d=>[d.code,d]));
const cats=[...new Set(DATA.map(d=>d.cat))].sort((a,b)=>(CAT_ORDER.indexOf(a)+99)%99-(CAT_ORDER.indexOf(b)+99)%99);
const view=document.getElementById('view');
const BOOK=[
 [1,'表紙','BRAND HISTORY BOOK'],[2,'ABOUT','ブランドの成り立ち'],[3,'LOGO TAG','ロゴタグ'],[4,'BRAND HISTORY','年表 1981–'],[5,'BRAND MESSAGE','Light is right'],
 [6,'1981 EAST COAST ROOTS','創業と山での実績'],[7,'MILITARY VALIDATION','米軍への採用'],[8,'ARCHIVES','アーカイブ'],[9,'DENALI JACKET','アーカイブ'],[10,'MAKALU JACKET','アーカイブ'],
 [11,'REVERSIBLE PRIMALOFT','セーター＆ベスト'],[12,'MILITARY ARCHIVES','ミリタリーアーカイブ'],[13,'TRANSPORT PARKA','アーカイブ'],[14,'HAPPY SUIT','アーカイブ'],[15,'ECWCS GEN III','コールドウェザースーツ'],
 [16,'WILD THINGS ICONS','現行アイコン'],[17,'MONSTER PARKA','SHORT MONSTER PARKA'],[18,'HAPPY JACKET','OVER TRANSPORT PARKA'],[19,'DENALI / MAKALU','現行アイコン'],[20,'BELAY / SUPPLEX','現行アイコン'],
 [21,'POLARTEC WIND PRO','T-SHIRTS'],[22,'COLLABORATIONS','LOGO REGULATION'],[23,'STORES','ACTIVATIONS']];
const TOC=[[1,'表紙'],[2,'ABOUT'],[4,'BRAND HISTORY'],[5,'BRAND MESSAGE'],[6,'ROOTS'],[7,'MILITARY'],[8,'ARCHIVES'],[16,'ICONS'],[22,'COLLABORATIONS'],[23,'STORES']];
const BOOK_LINK=[[/SHORT MONSTER|MONSTER PARKA|MONSTER PANTS/,17],[/HAPPY JACKET/,18],[/TRANSPORT PARKA/,13],[/DENALI/,19],[/BELAY/,20],[/POLARTEC STORM|POLARTEC DETACHABLE|WIND PRO/,21]];
const bookPage=d=>{const s=(d.name+' '+d.fabrics.join(' ')).toUpperCase();const m=BOOK_LINK.find(([r])=>r.test(s));return m?m[1]:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={q:'',cat:''};
const thumb=d=>d.imgs.length?d.imgs[d.colors[0]?.img??0]?.f||d.imgs[0].f:'';
function card(d){
  return `<button class="card" data-go="p-${esc(d.code)}">
    <div class="ph">${thumb(d)?`<img loading="lazy" src="${thumb(d)}" alt="${esc(d.name)}">`:''}</div>
    <div class="body">
      <span class="code">${esc(d.code)}</span>
      <span class="name">${esc(d.name)}</span>
      <div class="meta"><span>${esc(d.cat)}</span><span><b>${d.colors.length}</b> 色</span><span><b>${d.sizes.join(' / ')}</b></span><span>投入 <b>${d.total}</b></span></div>
      <div class="sales"><span class="on">宮下販売</span><span class="on">TGM販売</span></div>
    </div></button>`;
}
function setTab(t){document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t))}
function renderItems(){
  setTab('items');
  const q=state.q.trim().toUpperCase();
  const list=DATA.filter(d=>(!state.cat||d.cat===state.cat)&&(!q||(d.code+' '+d.name+' '+d.fab.map(i=>FAB[i].name+' '+FAB[i].ja).join(' ')).toUpperCase().includes(q)));
  view.innerHTML=`<div class="toolbar">
      <input id="q" type="search" placeholder="品番・商品名・生地名で検索" value="${esc(state.q)}" aria-label="検索">
      <span class="count">${list.length} / ${DATA.length} 品番</span></div>
    <div class="toolbar chips">${['',...cats].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat===c}">${c||'すべて'}</button>`).join('')}</div>
    ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<p class="empty">該当する品番がありません。検索語を変えてください。</p>'}`;
  const qi=document.getElementById('q');
  qi.addEventListener('input',e=>{state.q=e.target.value;const p=qi.selectionStart;renderItems();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)});
  view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderItems()});
}
function renderCats(){
  setTab('cats');
  view.innerHTML=`<div class="crumb"><h2 class="sec">カテゴリー</h2><span class="count">${cats.length} カテゴリー / ${DATA.length} 品番</span></div>

let lastTab='items';
function route(){
  const h=location.hash.slice(1)||'items';

  else if(h==='cats'){lastTab='cats';renderCats()}
  else if(h.startsWith('c-')){lastTab='cats';renderCat(+h.slice(2))}
  else if(h==='fabrics'){lastTab='fabrics';renderFabrics()}
  else if(h.startsWith('f-')){lastTab='fabrics';renderFabric(h.slice(2))}
  else if(h==='brand'||h.startsWith('brand-p')){renderBrand(+h.slice(7)||0)}
  else if(h.startsWith('p-'))renderProduct(h.slice(2),lastTab);
  else renderItems();
}

const ACCESS={"a31d66": {"s": "-o-CHax-ZFjPc9smKUZGSA", "i": "GWXPMRGFteUh3c6O", "w": "nXKNHQVwWPU_3sgbcK4HZz6u1AAqPWBbAbLdsbk1xkH3WmdfXHmk49TJMt7-4LzL"}};
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function decryptWith(key){
  const [id,sec]=String(key).trim().split('.');const e=ACCESS[id];if(!e||!sec)throw 0;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(sec),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},kek,b64(e.w));
  const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.i)},K,b64(PAYLOAD.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
function gate(msg){
  document.body.classList.add('locked');
  document.getElementById('view').innerHTML=`<div class="gate"><h2>閲覧には承認が必要です</h2>
   <p>このページは関係者専用の閲覧ページです。閲覧用URL（アクセスキー付き）から開いてください。</p>

   <dt>社外の方</dt><dd>担当の木原 <span class="mail">kihara@ins.fm</span> に閲覧を申請してください。承認後、閲覧用URLをお送りします。</dd></dl>
   <form id="kf"><input id="keyin" placeholder="アクセスキーをお持ちの方はこちらに入力" autocomplete="off" aria-label="アクセスキー"><button type="submit">開く</button></form>
   <div class="err" id="kerr">${msg||''}</div></div>`;
  document.getElementById('kf').onsubmit=async e=>{e.preventDefault();const v=document.getElementById('keyin').value;await tryKey(v,true)};
}
async function tryKey(k,fromForm){
  try{const c=await decryptWith(k);try{localStorage.setItem('wt26fw_key',k)}catch(_){}
    document.body.classList.remove('locked');startApp(c.data,c.fabrics);return true}
  catch(_){try{localStorage.removeItem('wt26fw_key')}catch(e){} gate(fromForm||k?'アクセスキーが無効か、閲覧期限が切れています。担当者にお問い合わせください。':'');return false}
}
(async()=>{
  const u=new URL(location.href);let k=u.searchParams.get('key');
  if(k){u.searchParams.delete('key');history.replaceState(null,'',u.pathname+u.search+u.hash)}
  if(!k){try{k=localStorage.getItem('wt26fw_key')}catch(_){}}
  if(!k||!window.crypto?.subtle){gate(window.crypto?.subtle?'':'このブラウザでは表示できません。最新のブラウザでお試しください。');return}
  await tryKey(k,false);
